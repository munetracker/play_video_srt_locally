<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Video SRT Player</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

:root {
    color-scheme: dark;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #0b0d0f;
    color: #f4f5f6;

    font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
}

body {
    min-height: 100vh;
}

.wrap {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 14px;
}


/* =========================================================
   SETUP
========================================================= */

.setup {
    background: #15181c;
    border: 1px solid #282e35;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 14px;
}


/* =========================================================
   SETUP CONTROLS
========================================================= */

.setup-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    width: 100%;
}

.file-field {
    flex: 1 1 0;
    min-width: 0;
}

.file-field label {
    display: block;
    font-size: 12px;
    color: #aeb5bd;
    margin: 0 0 5px 2px;
}

.input-row {
    display: flex;
    gap: 6px;
    width: 100%;
}

.input-row input {
    min-width: 0;
    flex: 1;
}

input,
select {
    width: 100%;

    background: #0f1215;
    color: #eee;

    border: 1px solid #343b44;
    border-radius: 9px;

    padding: 10px 12px;

    font-size: 14px;

    outline: none;
}

input:focus,
select:focus {
    border-color: #55c7ce;
}

button {
    border: 1px solid #3a424b;

    background: #20252b;

    color: #fff;

    border-radius: 9px;

    padding: 10px 14px;

    font-size: 14px;

    cursor: pointer;

    white-space: nowrap;
}

button:hover {
    background: #292f36;
}

.primary {
    background: #15565b;
    border-color: #2b9da4;
}

.setup-row > button {
    flex-shrink: 0;
}

.setup-row > select {
    width: 250px;
    flex-shrink: 0;
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace {
    display: flex;

    width: 100%;

    gap: 12px;

    align-items: flex-start;
}


/* =========================================================
   RIGHT SUBTITLE
   VIDEO 70% / SUBTITLE 30%
========================================================= */

.workspace.subtitle-right {
    flex-direction: row;
    flex-wrap: nowrap;
}

.workspace.subtitle-right .player {
    order: 1;

    flex: 0 0 calc(70% - 6px);

    width: calc(70% - 6px);

    min-width: 0;
}

.workspace.subtitle-right .panel {
    order: 2;

    flex: 0 0 calc(30% - 6px);

    width: calc(30% - 6px);

    min-width: 0;
}


/* =========================================================
   LEFT SUBTITLE
   SUBTITLE 30% / VIDEO 70%
========================================================= */

.workspace.subtitle-left {
    flex-direction: row;
    flex-wrap: nowrap;
}

.workspace.subtitle-left .panel {
    order: 1;

    flex: 0 0 calc(30% - 6px);

    width: calc(30% - 6px);

    min-width: 0;
}

.workspace.subtitle-left .player {
    order: 2;

    flex: 0 0 calc(70% - 6px);

    width: calc(70% - 6px);

    min-width: 0;
}


/* =========================================================
   VIDEO ONLY
========================================================= */

.workspace.video-only {
    display: block;
    width: 100%;
}

.workspace.video-only .player {
    width: 100%;
    max-width: none;
}

.workspace.video-only .panel {
    display: none;
}


/* =========================================================
   PLAYER
========================================================= */

.player {
    background: #14171b;

    border-radius: 14px;

    overflow: hidden;

    border: 1px solid #252b32;

    min-width: 0;
}

.video-wrap {
    position: relative;

    width: 100%;

    background: #000;
}

video {
    display: block;

    width: 100%;

    height: auto;

    aspect-ratio: 16 / 9;

    background: #000;

    object-fit: contain;

    max-height: 76vh;
}


/* =========================================================
   VIDEO TOOLBAR
========================================================= */

.video-toolbar {

    display: flex;

    align-items: center;

    gap: 8px;

    width: 100%;

    padding: 8px 10px;

    background: #101317;

    border-top: 1px solid #252b32;

}


/* =========================================================
   PLAY / PAUSE BUTTON
========================================================= */

.video-toolbar button {

    flex: 0 0 auto;

    padding: 8px 13px;

}


.play-btn {

    background: #15565b;

    border-color: #2b9da4;

}


.play-btn:hover {

    background: #1b6b70;

}


/* =========================================================
   STOP BUTTON
========================================================= */

.stop-btn {

    background: #25292e;

}


.stop-btn:hover {

    background: #30363d;

}


/* =========================================================
   VOLUME
========================================================= */

.volume-control {

    display: flex;

    align-items: center;

    gap: 7px;

    flex: 0 1 280px;

    min-width: 150px;

}


.volume-icon {

    font-size: 15px;

    width: 20px;

    flex-shrink: 0;

    text-align: center;

}


#volumeBoost {

    width: 100%;

    min-width: 60px;

    cursor: pointer;

    accent-color: #38bdc5;

}


.volume-value {

    min-width: 43px;

    text-align: right;

    font-size: 12px;

    font-weight: 600;

    color: #78d5da;

}


/* =========================================================
   VIDEO TITLE
========================================================= */

.video-name {

    flex: 1 1 auto;

    min-width: 0;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    color: #c6ccd2;

    font-size: 13px;

}


/* =========================================================
   VIDEO TIME
========================================================= */

.video-time {

    flex: 0 0 auto;

    color: #9da6b0;

    font-size: 12px;

    font-variant-numeric: tabular-nums;

    white-space: nowrap;

}


/* =========================================================
   OVERLAY SUBTITLE
========================================================= */

.overlay-sub {

    position: absolute;

    left: 4%;
    right: 4%;

    bottom: 9%;

    text-align: center;

    pointer-events: none;

    display: none;

    z-index: 10;
}

.overlay-sub span {

    display: inline-block;

    max-width: 94%;

    padding: 6px 11px;

    background: rgba(0, 0, 0, 0.78);

    border-radius: 4px;

    color: #fff;

    font-size:
        clamp(15px, 2vw, 24px);

    line-height: 1.35;

    text-shadow:
        0 1px 2px #000;
}


/* =========================================================
   SUBTITLE PANEL
========================================================= */

.panel {

    background: #15181c;

    border: 1px solid #252b32;

    border-radius: 14px;

    overflow: hidden;

    min-width: 0;
}

.head {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 12px 14px;

    border-bottom:
        1px solid #292f36;
}

.count {

    color: #78d5da;

    font-weight: 700;

    font-size: 12px;
}

.subs {

    height:
        calc(76vh - 45px);

    max-height:
        calc(76vh - 45px);

    overflow-y: auto;

    padding: 5px;
}

.sub {

    padding: 11px 12px;

    border-left:
        3px solid transparent;

    border-radius: 8px;

    cursor: pointer;
}

.sub:hover {
    background: #1b2026;
}

.sub.active {

    background: #182127;

    border-left-color:
        #38bdc5;
}

.time {

    font-size: 12px;

    color: #7e8994;

    margin-bottom: 4px;
}

.text {

    font-size: 16px;

    line-height: 1.35;
}

.empty {

    text-align: center;

    padding: 45px 18px;

    color: #7f8994;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1000px) {

    .setup-row {
        flex-wrap: wrap;
    }

    .file-field {
        flex: 1 1 45%;
    }

    .setup-row > select {

        flex: 1 1 250px;

        width: auto;

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    .workspace,
    .workspace.subtitle-left,
    .workspace.subtitle-right {

        display: flex;

        flex-direction: column;

        width: 100%;

        gap: 12px;

    }

    .workspace .player,
    .workspace .panel {

        order: initial;

        flex: none;

        width: 100%;

        max-width: 100%;

    }

    .workspace .player {
        order: 1;
    }

    .workspace .panel {
        order: 2;
    }

    video {
        max-height: 55vh;
    }

    .subs {

        height: 45vh;

        max-height: 45vh;

    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 600px) {

    .wrap {
        padding: 8px;
    }

    .setup-row {

        flex-direction: column;

        align-items: stretch;

    }

    .file-field {
        width: 100%;
    }

    .input-row {
        width: 100%;
    }

    .setup-row > button,
    .setup-row > select {

        width: 100%;

    }

    .video-toolbar {

        gap: 6px;

        padding: 7px;

    }

    .video-toolbar button {

        padding: 7px 9px;

        font-size: 12px;

    }

    .volume-control {

        flex: 1 1 auto;

        min-width: 80px;

    }

    .volume-icon {
        display: none;
    }

    .video-name {

        max-width: 120px;

        font-size: 12px;

    }

    .video-time {
        font-size: 11px;
    }

    .text {
        font-size: 15px;
    }

}

</style>

</head>


<body>


<div class="wrap">


<!-- =======================================================
     FILE CONTROLS
======================================================== -->

<section class="setup">

    <div class="setup-row">


        <!-- MP4 -->

        <div class="file-field">

            <div class="input-row">

                <input
                    id="videoPath"
                    placeholder="video.mp4"
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="browseVideo"
                >
                    Choose
                </button>

            </div>

        </div>


        <!-- SRT -->

        <div class="file-field">

            <div class="input-row">

                <input
                    id="srtPath"
                    placeholder="subtitle.srt"
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="browseSrt"
                >
                    Choose
                </button>

            </div>

        </div>


        <!-- LOAD -->

        <button
            type="button"
            class="primary"
            id="load"
        >
            Load Video + Subtitles
        </button>


        <!-- CLEAR -->

        <button
            type="button"
            id="clear"
        >
            Clear
        </button>


        <!-- DISPLAY MODE -->

        <select
            id="displayMode"
            aria-label="Subtitle display"
        >

            <option value="right">
                Right side subtitle
            </option>

            <option value="left">
                Left side subtitle
            </option>

            <option value="overlay">
                On video only
            </option>

            <option value="both-right">
                On video and right side
            </option>

            <option value="both-left">
                On video and left side
            </option>

        </select>

    </div>

</section>


<!-- =======================================================
     WORKSPACE
======================================================== -->

<main
    id="workspace"
    class="workspace subtitle-right"
>


    <!-- ===================================================
         VIDEO
    ==================================================== -->

    <section class="player">


        <div class="video-wrap">


            <video
                id="video"
                controls
                preload="metadata"
                playsinline
            ></video>


            <!-- OVERLAY SUBTITLE -->

            <div
                id="overlaySub"
                class="overlay-sub"
            >

                <span></span>

            </div>


        </div>


        <!-- =================================================
             SINGLE ROW TOOLBAR

             PLAY/PAUSE | STOP | VOLUME | TITLE | TIME
        ================================================== -->

        <div class="video-toolbar">


            <!-- PLAY / PAUSE -->

            <button
                type="button"
                id="playPauseBtn"
                class="play-btn"
            >
                ▶ Play
            </button>


            <!-- STOP -->

            <button
                type="button"
                id="stopBtn"
                class="stop-btn"
            >
                ⏹ Stop
            </button>


            <!-- VOLUME -->

            <div class="volume-control">

                <span class="volume-icon">
                    🔊
                </span>


                <input
                    id="volumeBoost"
                    type="range"
                    min="0"
                    max="200"
                    value="100"
                    step="1"
                    aria-label="Volume"
                >


                <span
                    id="volumeValue"
                    class="volume-value"
                >
                    100%
                </span>

            </div>


            <!-- VIDEO TITLE -->

            <div
                id="name"
                class="video-name"
                title="No video loaded"
            >
                No video loaded
            </div>


            <!-- TIME -->

            <div
                id="duration"
                class="video-time"
            >
                00:00
            </div>


        </div>


    </section>


    <!-- ===================================================
         SUBTITLE PANEL
    ==================================================== -->

    <section
        class="panel"
        id="subtitlePanel"
    >


        <div class="head">

            <strong>
                Subtitles
            </strong>


            <span
                id="count"
                class="count"
            >
                0/0
            </span>

        </div>


        <div
            id="subs"
            class="subs"
        >

            <div class="empty">
                Load an MP4 and its SRT.
            </div>

        </div>


    </section>


</main>


</div>



<script>

(() => {


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "create_subs_player_settings_v9";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const videoPath =
    document.getElementById("videoPath");

const srtPath =
    document.getElementById("srtPath");

const loadBtn =
    document.getElementById("load");

const clearBtn =
    document.getElementById("clear");

const playPauseBtn =
    document.getElementById("playPauseBtn");

const stopBtn =
    document.getElementById("stopBtn");

const subsEl =
    document.getElementById("subs");

const count =
    document.getElementById("count");

const nameEl =
    document.getElementById("name");

const durationEl =
    document.getElementById("duration");

const displayMode =
    document.getElementById("displayMode");

const subtitlePanel =
    document.getElementById("subtitlePanel");

const workspace =
    document.getElementById("workspace");

const overlay =
    document.getElementById("overlaySub");

const overlayText =
    overlay.querySelector("span");

const volumeBoost =
    document.getElementById("volumeBoost");

const volumeValue =
    document.getElementById("volumeValue");


/* =========================================================
   VARIABLES
========================================================= */

let selectedVideoFile = null;

let selectedSrtFile = null;

let videoObjectUrl = null;

let cues = [];

let activeIndex = -1;


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

let gainNode = null;

let sourceNode = null;


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value) {

    return String(value).replace(
        /[&<>"']/g,

        character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[character])

    );

}


/* =========================================================
   SRT TIME
========================================================= */

function sec(value) {

    const parts =
        value
            .trim()
            .replace(",", ".")
            .split(":")
            .map(Number);


    if (parts.length === 3) {

        return (
            parts[0] * 3600 +
            parts[1] * 60 +
            parts[2]
        );

    }


    if (parts.length === 2) {

        return (
            parts[0] * 60 +
            parts[1]
        );

    }


    return 0;

}


/* =========================================================
   FORMAT TIME
========================================================= */

function fmt(value) {

    value =
        Math.max(
            0,
            Math.floor(
                Number(value) || 0
            )
        );


    const hours =
        Math.floor(
            value / 3600
        );


    const minutes =
        Math.floor(
            (value % 3600) / 60
        );


    const seconds =
        value % 60;


    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0")
        );

    }


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")
    );

}


/* =========================================================
   PARSE SRT
========================================================= */

function parseSrt(text) {

    const blocks =
        text
            .replace(/\r/g, "")
            .replace(/^\uFEFF/, "")
            .split(/\n\s*\n/);


    const result = [];


    for (const block of blocks) {

        const lines =
            block.split("\n");


        const timeIndex =
            lines.findIndex(
                line =>
                    line.includes("-->")
            );


        if (timeIndex < 0)
            continue;


        const match =
            lines[timeIndex].match(
                /(\d{1,2}:\d{2}:\d{2}[,.]\d{1,3}|\d{1,2}:\d{2}[,.]\d{1,3})\s*-->\s*(\d{1,2}:\d{2}:\d{2}[,.]\d{1,3}|\d{1,2}:\d{2}[,.]\d{1,3})/
            );


        if (!match)
            continue;


        const subtitleText =
            lines
                .slice(timeIndex + 1)
                .join("\n")
                .trim();


        if (!subtitleText)
            continue;


        result.push({

            start:
                sec(match[1]),

            end:
                sec(match[2]),

            text:
                subtitleText

        });

    }


    return result;

}


/* =========================================================
   RENDER SUBTITLES
========================================================= */

function render() {

    if (!cues.length) {

        subsEl.innerHTML =
            '<div class="empty">No subtitle entries found.</div>';

        count.textContent =
            "0/0";

        return;

    }


    subsEl.innerHTML =
        cues
            .map(
                (cue, index) => `

                    <div
                        class="sub"
                        data-i="${index}"
                    >

                        <div class="time">
                            ${fmt(cue.start)}
                        </div>

                        <div class="text">
                            ${esc(cue.text).replace(
                                /\n/g,
                                "<br>"
                            )}
                        </div>

                    </div>

                `
            )
            .join("");


    subsEl
        .querySelectorAll(".sub")
        .forEach(element => {

            element.addEventListener(
                "click",
                () => {

                    const index =
                        Number(
                            element.dataset.i
                        );


                    video.currentTime =
                        cues[index].start;


                    playVideo();

                }
            );

        });

}


/* =========================================================
   DISPLAY MODE
========================================================= */

function updateMode() {

    const mode =
        displayMode.value;


    workspace.classList.remove(
        "subtitle-right",
        "subtitle-left",
        "video-only"
    );


    subtitlePanel.style.display =
        "";


    overlay.style.display =
        "none";


    if (mode === "right") {

        workspace.classList.add(
            "subtitle-right"
        );

    }


    else if (mode === "left") {

        workspace.classList.add(
            "subtitle-left"
        );

    }


    else if (mode === "overlay") {

        workspace.classList.add(
            "video-only"
        );


        subtitlePanel.style.display =
            "none";


        overlay.style.display =
            "block";

    }


    else if (mode === "both-right") {

        workspace.classList.add(
            "subtitle-right"
        );


        overlay.style.display =
            "block";

    }


    else if (mode === "both-left") {

        workspace.classList.add(
            "subtitle-left"
        );


        overlay.style.display =
            "block";

    }

}


/* =========================================================
   AUDIO BOOST SETUP
========================================================= */

function setupAudioBoost() {

    if (audioContext)
        return;


    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        sourceNode =
            audioContext.createMediaElementSource(
                video
            );


        gainNode =
            audioContext.createGain();


        sourceNode.connect(
            gainNode
        );


        gainNode.connect(
            audioContext.destination
        );


        updateVolumeBoost();

    }

    catch (error) {

        console.error(
            "Web Audio setup failed:",
            error
        );

    }

}


/* =========================================================
   VOLUME BOOST
========================================================= */

function updateVolumeBoost() {

    const percent =
        Number(
            volumeBoost.value
        );


    volumeValue.textContent =
        `${percent}%`;


    if (gainNode) {

        gainNode.gain.value =
            percent / 100;

    }


    /*
     * Native video volume remains at 100%.
     */

    video.volume =
        1;

}


/* =========================================================
   PLAY VIDEO
========================================================= */

async function playVideo() {

    setupAudioBoost();


    if (
        audioContext &&
        audioContext.state === "suspended"
    ) {

        try {

            await audioContext.resume();

        }

        catch (error) {

            console.warn(
                "Could not resume audio context:",
                error
            );

        }

    }


    try {

        await video.play();

    }

    catch (error) {

        console.warn(
            "Could not play video:",
            error
        );

    }

}


/* =========================================================
   PLAY / PAUSE BUTTON
========================================================= */

playPauseBtn.addEventListener(
    "click",
    () => {

        if (video.paused) {

            playVideo();

        }

        else {

            video.pause();

        }

    }
);


/* =========================================================
   VIDEO PLAY EVENT
========================================================= */

video.addEventListener(
    "play",
    async () => {

        playPauseBtn.textContent =
            "⏸ Pause";


        setupAudioBoost();


        if (
            audioContext &&
            audioContext.state === "suspended"
        ) {

            try {

                await audioContext.resume();

            }

            catch (error) {

                console.warn(
                    "Could not resume audio context:",
                    error
                );

            }

        }


        updateVolumeBoost();

    }
);


/* =========================================================
   VIDEO PAUSE EVENT
========================================================= */

video.addEventListener(
    "pause",
    () => {

        playPauseBtn.textContent =
            "▶ Play";

    }
);


/* =========================================================
   STOP
========================================================= */

stopBtn.addEventListener(
    "click",
    () => {

        video.pause();

        video.currentTime = 0;

        playPauseBtn.textContent =
            "▶ Play";

        activeIndex = -1;

        updateActive();

    }
);


/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings() {

    try {

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify({

                videoPath:
                    videoPath.value.trim(),

                srtPath:
                    srtPath.value.trim(),

                displayMode:
                    displayMode.value,

                volume:
                    volumeBoost.value

            })

        );

    }

    catch (error) {

        console.warn(
            "Could not save settings.",
            error
        );

    }

}


/* =========================================================
   LOAD SETTINGS
========================================================= */

function loadSettings() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!raw)
            return;


        const settings =
            JSON.parse(raw);


        if (settings.videoPath) {

            videoPath.value =
                settings.videoPath;

        }


        if (settings.srtPath) {

            srtPath.value =
                settings.srtPath;

        }


        if (settings.displayMode) {

            displayMode.value =
                settings.displayMode;

        }


        if (
            settings.volume !== undefined
        ) {

            volumeBoost.value =
                settings.volume;

        }

    }

    catch (error) {

        console.warn(
            "Could not restore settings.",
            error
        );

    }


    updateVolumeBoost();

}


/* =========================================================
   ACTIVE SUBTITLE
========================================================= */

function updateActive() {

    if (!cues.length)
        return;


    const currentTime =
        video.currentTime;


    let index = -1;


    for (
        let i = 0;
        i < cues.length;
        i++
    ) {

        if (
            currentTime >= cues[i].start &&
            currentTime < cues[i].end
        ) {

            index = i;

            break;

        }

    }


    if (index === activeIndex)
        return;


    activeIndex =
        index;


    subsEl
        .querySelectorAll(".sub")
        .forEach(
            (element, i) => {

                element.classList.toggle(
                    "active",
                    i === index
                );

            }
        );


    if (index >= 0) {

        count.textContent =
            `${index + 1}/${cues.length}`;


        overlayText.innerHTML =
            esc(cues[index].text)
                .replace(
                    /\n/g,
                    "<br>"
                );


        const element =
            subsEl.querySelector(
                `[data-i="${index}"]`
            );


        if (element) {

            element.scrollIntoView({

                block: "nearest",

                behavior: "smooth"

            });

        }

    }

    else {

        count.textContent =
            `0/${cues.length}`;


        overlayText.textContent =
            "";

    }

}


/* =========================================================
   LOAD FILES
========================================================= */

async function loadFiles() {

    if (!selectedVideoFile)
        return;


    if (!selectedSrtFile)
        return;


    if (videoObjectUrl) {

        URL.revokeObjectURL(
            videoObjectUrl
        );

    }


    videoObjectUrl =
        URL.createObjectURL(
            selectedVideoFile
        );


    video.src =
        videoObjectUrl;


    video.load();


    setupAudioBoost();

    updateVolumeBoost();


    videoPath.value =
        selectedVideoFile.name;


    nameEl.textContent =
        selectedVideoFile.name;


    try {

        const srtText =
            await selectedSrtFile.text();


        cues =
            parseSrt(srtText);


        activeIndex =
            -1;


        render();

        updateMode();

    }

    catch (error) {

        console.error(
            "SRT error:",
            error
        );


        cues = [];

        render();

    }


    saveSettings();

}


/* =========================================================
   CHOOSE MP4
========================================================= */

document
    .getElementById("browseVideo")
    .addEventListener(
        "click",
        () => {

            const input =
                document.createElement(
                    "input"
                );


            input.type =
                "file";


            input.accept =
                "video/mp4,video/*";


            input.onchange =
                () => {

                    if (!input.files.length)
                        return;


                    selectedVideoFile =
                        input.files[0];


                    videoPath.value =
                        selectedVideoFile.name;


                    if (videoObjectUrl) {

                        URL.revokeObjectURL(
                            videoObjectUrl
                        );

                    }


                    videoObjectUrl =
                        URL.createObjectURL(
                            selectedVideoFile
                        );


                    video.src =
                        videoObjectUrl;


                    video.load();


                    nameEl.textContent =
                        selectedVideoFile.name;


                    setupAudioBoost();

                    updateVolumeBoost();

                    saveSettings();

                };


            input.click();

        }
    );


/* =========================================================
   CHOOSE SRT
========================================================= */

document
    .getElementById("browseSrt")
    .addEventListener(
        "click",
        () => {

            const input =
                document.createElement(
                    "input"
                );


            input.type =
                "file";


            input.accept =
                ".srt,text/plain";


            input.onchange =
                async () => {

                    if (!input.files.length)
                        return;


                    selectedSrtFile =
                        input.files[0];


                    srtPath.value =
                        selectedSrtFile.name;


                    try {

                        const text =
                            await selectedSrtFile.text();


                        cues =
                            parseSrt(text);


                        activeIndex =
                            -1;


                        render();

                    }

                    catch (error) {

                        console.error(
                            "SRT error:",
                            error
                        );

                    }


                    saveSettings();

                };


            input.click();

        }
    );


/* =========================================================
   LOAD BUTTON
========================================================= */

loadBtn.addEventListener(
    "click",
    loadFiles
);


/* =========================================================
   CLEAR
========================================================= */

clearBtn.addEventListener(
    "click",
    () => {

        video.pause();

        video.currentTime = 0;

        video.removeAttribute(
            "src"
        );

        video.load();


        if (videoObjectUrl) {

            URL.revokeObjectURL(
                videoObjectUrl
            );

            videoObjectUrl =
                null;

        }


        selectedVideoFile =
            null;


        selectedSrtFile =
            null;


        cues = [];


        activeIndex =
            -1;


        render();


        count.textContent =
            "0/0";


        nameEl.textContent =
            "No video loaded";


        durationEl.textContent =
            "00:00";


        overlayText.textContent =
            "";


        playPauseBtn.textContent =
            "▶ Play";

    }
);


/* =========================================================
   DISPLAY MODE
========================================================= */

displayMode.addEventListener(
    "change",
    () => {

        updateMode();

        saveSettings();

    }
);


/* =========================================================
   VOLUME
========================================================= */

volumeBoost.addEventListener(
    "input",
    () => {

        setupAudioBoost();

        updateVolumeBoost();

        saveSettings();

    }
);


/* =========================================================
   VIDEO METADATA
========================================================= */

video.addEventListener(
    "loadedmetadata",
    () => {

        durationEl.textContent =
            fmt(video.duration);

    }
);


/* =========================================================
   VIDEO TIME UPDATE
========================================================= */

video.addEventListener(
    "timeupdate",
    updateActive
);


/* =========================================================
   INITIALIZE
========================================================= */

loadSettings();

updateMode();

updateVolumeBoost();


})();
</script>


</body>

</html>
